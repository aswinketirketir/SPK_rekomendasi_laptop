<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}LaptopKu — Pemilihan Laptop Mahasiswa Berbasis Data{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://unpkg.com/lenis@1.1.18/dist/lenis.min.js"></script>
  <style>
    :root {
      --black: #0b0d12;
      --black-elevated: #141821;
      --white: #ffffff;
      --stone: #f3f5f8;         /* Cool Alabaster / Slate Soft */
      --bg: #f8fafc;
      --border: #e2e8f0;
      --border-dark: rgba(255, 255, 255, 0.14);
      --ink: #0f172a;
      --muted: #64748b;
      --muted-light: #94a3b8;
      --accent: #1e3a8a;        /* Deep Oxford Navy */
      --accent-hover: #172554;  /* Midnight Navy */
      --accent-soft: #eff6ff;
      --radius: 10px;
      --wrap: 1200px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html.lenis, html.lenis body { height: auto; }
    .lenis.lenis-smooth { scroll-behavior: auto !important; }
    .lenis.lenis-smooth [data-lenis-prevent] { overscroll-behavior: contain; }
    .lenis.lenis-stopped { overflow: hidden; }

    body {
      font-family: 'Plus Jakarta Sans', -apple-system, sans-serif;
      background: var(--white);
      color: var(--ink);
      line-height: 1.55;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    .mono {
      font-family: 'JetBrains Mono', monospace;
      font-variant-numeric: tabular-nums;
    }

    .skip-link {
      position: absolute;
      left: -9999px;
      top: 16px;
      z-index: 200;
      padding: 10px 16px;
      background: var(--black);
      color: var(--white);
      border-radius: 999px;
      font-weight: 600;
      text-decoration: none;
    }
    .skip-link:focus { left: 24px; }

    :focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    .wrap {
      width: 100%;
      max-width: var(--wrap);
      margin: 0 auto;
      padding: 0 24px;
    }

    /* EDITORIAL SCROLL REVEAL & STAGGERED GRID ANIMATION */
    .reveal {
      opacity: 0;
      transform: translateY(32px);
      transition:
        opacity 0.9s cubic-bezier(0.16, 1, 0.3, 1),
        transform 0.9s cubic-bezier(0.16, 1, 0.3, 1);
      will-change: opacity, transform;
    }
    .reveal.is-visible {
      opacity: 1;
      transform: translateY(0);
    }

    .card.grid-reveal {
      opacity: 0;
      transform: translateY(36px) scale(0.985);
      transition:
        opacity 0.85s cubic-bezier(0.16, 1, 0.3, 1) var(--stagger-delay, 0ms),
        transform 0.85s cubic-bezier(0.16, 1, 0.3, 1) var(--stagger-delay, 0ms),
        border-color 0.22s ease,
        box-shadow 0.22s ease;
      will-change: opacity, transform;
    }
    .card.grid-reveal.is-visible {
      opacity: 1;
      transform: translateY(0) scale(1);
    }
    .card.grid-reveal.is-visible:hover {
      transform: translateY(-3px) scale(1);
      transition-delay: 0ms;
    }

    /* FLOATING PILL NAVBAR */
    .nav-shell {
      position: fixed;
      top: 18px;
      left: 0;
      right: 0;
      z-index: 90;
      padding: 0 16px;
      pointer-events: none;
    }
    .pill-nav {
      pointer-events: auto;
      max-width: 780px;
      margin: 0 auto;
      height: 54px;
      padding: 0 8px 0 20px;
      background: rgba(11, 13, 18, 0.92);
      backdrop-filter: blur(14px);
      border: 1px solid var(--border-dark);
      border-radius: 999px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      box-shadow: 0 12px 32px rgba(11, 13, 18, 0.16);
    }
    .brand {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      color: var(--white);
      text-decoration: none;
      font-weight: 700;
      font-size: 1rem;
      letter-spacing: -0.02em;
    }
    .pill-links {
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .pill-links a {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 7px 14px;
      border-radius: 999px;
      color: var(--muted-light);
      text-decoration: none;
      font-size: 0.86rem;
      font-weight: 500;
      transition: color 0.15s ease, background-color 0.15s ease;
    }
    .pill-links a:hover { color: var(--white); }
    .pill-links a.active {
      background: rgba(255, 255, 255, 0.14);
      color: var(--white);
    }
    .pill-cta {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      height: 38px;
      padding: 0 16px;
      border-radius: 999px;
      background: var(--white);
      color: var(--black);
      text-decoration: none;
      font-size: 0.84rem;
      font-weight: 600;
      transition: transform 0.15s ease, background-color 0.15s ease;
    }
    .pill-cta:hover {
      background: #f1f5f9;
      transform: translateY(-1px);
    }
    .pill-cta:active { transform: scale(0.97); }

    /* BUTTONS */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-height: 46px;
      padding: 0 24px;
      border-radius: 999px;
      font-family: inherit;
      font-size: 0.9rem;
      font-weight: 600;
      text-decoration: none;
      cursor: pointer;
      border: 1px solid transparent;
      transition: transform 0.15s ease, background-color 0.15s ease, border-color 0.15s ease;
    }
    .btn:hover { transform: translateY(-1px); }
    .btn:active { transform: scale(0.98); }
    .btn-dark {
      background: var(--black);
      color: var(--white);
    }
    .btn-dark:hover { background: #1e293b; }
    .btn-white {
      background: var(--white);
      color: var(--black);
    }
    .btn-white:hover { background: #f1f5f9; }
    .btn-accent {
      background: var(--accent);
      color: var(--white);
    }
    .btn-accent:hover { background: var(--accent-hover); }
    .btn-outline {
      background: var(--white);
      color: var(--ink);
      border-color: var(--border);
    }
    .btn-outline:hover { border-color: var(--black); }
    .btn-outline-dark {
      background: transparent;
      color: var(--white);
      border-color: var(--border-dark);
    }
    .btn-outline-dark:hover {
      border-color: rgba(255, 255, 255, 0.45);
      background: rgba(255, 255, 255, 0.05);
    }

    /* EDITORIAL SECTION HEADER */
    .editorial-head {
      text-align: center;
      max-width: 600px;
      margin: 0 auto 44px;
    }
    .kicker {
      display: block;
      font-size: 0.72rem;
      font-weight: 600;
      letter-spacing: 0.24em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 12px;
    }
    .editorial-head h1, .editorial-head h2 {
      font-size: clamp(1.9rem, 3.2vw, 2.65rem);
      font-weight: 700;
      letter-spacing: -0.03em;
      line-height: 1.15;
      color: var(--black);
      margin-bottom: 12px;
    }
    .editorial-head p {
      font-size: 0.96rem;
      color: var(--muted);
    }

    /* CLEAN PRODUCT CARDS */
    .grid-4 {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 24px;
    }
    .grid-3 {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 28px;
    }
    .card {
      background: var(--white);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      cursor: pointer;
    }
    .card:hover {
      border-color: var(--black);
      box-shadow: 0 16px 34px rgba(15, 23, 42, 0.07);
    }
    .card-media {
      aspect-ratio: 4 / 3;
      background: var(--stone);
      overflow: hidden;
      position: relative;
    }
    .card-media img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.6s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .card:hover .card-media img { transform: scale(1.035); }
    .badge-minimal {
      position: absolute;
      top: 12px;
      left: 12px;
      padding: 4px 10px;
      border-radius: 999px;
      background: rgba(11, 13, 18, 0.88);
      color: var(--white);
      font-size: 0.72rem;
      font-weight: 600;
    }
    .card-body {
      padding: 20px 16px 22px;
      display: flex;
      flex-direction: column;
      flex: 1;
    }
    .card-title {
      font-size: 1.04rem;
      font-weight: 700;
      color: var(--black);
      line-height: 1.35;
      margin-bottom: 6px;
    }
    .card-summary {
      font-size: 0.83rem;
      color: var(--muted);
      line-height: 1.5;
      margin-bottom: 18px;
      display: -webkit-box;
      line-clamp: 2;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .card-bottom {
      margin-top: auto;
      text-align: center;
      padding-top: 12px;
    }
    .short-rule {
      width: 24px;
      height: 1.5px;
      background: #cbd5e1;
      margin: 0 auto 12px;
    }
    .price-accent {
      font-family: 'Plus Jakarta Sans', -apple-system, sans-serif;
      font-variant-numeric: tabular-nums;
      font-size: 1.08rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: var(--accent);
    }
    .sub-score {
      display: block;
      font-family: 'Plus Jakarta Sans', -apple-system, sans-serif;
      font-variant-numeric: tabular-nums;
      font-size: 0.78rem;
      font-weight: 500;
      color: var(--muted);
      margin-top: 4px;
    }

    /* FULL SPECIFICATION MODAL */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 150;
      background: rgba(11, 13, 18, 0.65);
      backdrop-filter: blur(5px);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .modal-backdrop.open { display: flex; }
    .modal-box {
      background: var(--white);
      border: 1px solid var(--border);
      border-radius: 14px;
      width: 100%;
      max-width: 660px;
      max-height: 90vh;
      overflow-y: auto;
      animation: modalIn 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }
    @keyframes modalIn {
      from { opacity: 0; transform: translateY(10px) scale(0.98); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
    .modal-head {
      padding: 18px 22px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      position: sticky;
      top: 0;
      background: var(--white);
      z-index: 2;
    }
    .score-pill {
      display: inline-block;
      padding: 3px 10px;
      border-radius: 999px;
      background: var(--accent-soft);
      color: var(--accent);
      font-size: 0.75rem;
      font-weight: 600;
    }
    .close-btn {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      border: 1px solid var(--border);
      background: var(--white);
      display: grid;
      place-items: center;
      cursor: pointer;
      flex-shrink: 0;
    }
    .close-btn:hover { background: #f1f5f9; }
    .modal-body { padding: 22px; }
    .modal-hero {
      display: grid;
      grid-template-columns: 220px 1fr;
      gap: 20px;
      margin-bottom: 20px;
      align-items: center;
    }
    .modal-hero img {
      width: 100%;
      aspect-ratio: 4 / 3;
      object-fit: cover;
      border-radius: 10px;
      background: var(--stone);
    }
    .full-spec-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
    }
    .spec-cell {
      padding: 12px 14px;
      background: var(--bg);
      border-radius: 8px;
    }
    .spec-cell-label {
      font-size: 0.74rem;
      color: var(--muted);
      margin-bottom: 3px;
    }
    .spec-cell-val {
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--ink);
    }

    /* FOOTER */
    footer {
      border-top: 1px solid var(--border-dark);
      background: var(--black);
      color: var(--muted-light);
      padding: 36px 0;
      font-size: 0.84rem;
    }
    .footer-inner {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
    }
    footer strong { color: var(--white); }

    @media (max-width: 1024px) {
      .grid-4 { grid-template-columns: repeat(2, 1fr); }
    }
    @media (max-width: 820px) {
      .grid-3 { grid-template-columns: repeat(2, 1fr); }
    }
    @media (max-width: 600px) {
      .wrap { padding: 0 16px; }
      .grid-4, .grid-3, .modal-hero, .full-spec-grid { grid-template-columns: 1fr; }
      .pill-nav { padding: 0 8px 0 14px; }
      .pill-links a span { display: none; }
      .pill-cta { padding: 0 12px; font-size: 0.8rem; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { transition: none !important; animation: none !important; }
      .reveal, .card.grid-reveal { opacity: 1 !important; transform: none !important; }
    }
  </style>
  {% block extra_css %}{% endblock %}
</head>
<body>
  <a href="#main-content" class="skip-link">Langsung ke konten utama</a>

  <div class="nav-shell">
    <nav class="pill-nav" aria-label="Navigasi Utama">
      <a href="/" class="brand">
        <span>LaptopKu</span>
      </a>

      <div class="pill-links">
        <a href="/" class="{% if request.path == '/' %}active{% endif %}">
          <i data-lucide="home" style="width:15px;height:15px;"></i>
          <span>Beranda</span>
        </a>
        <a href="/katalog/" class="{% if request.path == '/katalog/' %}active{% endif %}">
          <i data-lucide="layout-grid" style="width:15px;height:15px;"></i>
          <span>Katalog</span>
        </a>
        <a href="/rekomendasi/" class="{% if request.path == '/rekomendasi/' %}active{% endif %}">
          <i data-lucide="sliders-horizontal" style="width:15px;height:15px;"></i>
          <span>Rekomendasi</span>
        </a>
      </div>

      <a href="/rekomendasi/" class="pill-cta">
        <span>Cari Laptop</span>
        <i data-lucide="arrow-up-right" style="width:14px;height:14px;"></i>
      </a>
    </nav>
  </div>

  <main id="main-content">
    {% block content %}{% endblock %}
  </main>

  <div id="specModal" class="modal-backdrop" role="dialog" aria-modal="true" aria-labelledby="modalTitle" data-lenis-prevent>
    <div class="modal-box">
      <div class="modal-head">
        <div>
          <span id="modalBrandBadge" class="score-pill mono">KLASTER</span>
          <h3 id="modalTitle" style="margin-top:4px;font-size:1.1rem;">Detail Spesifikasi Laptop</h3>
        </div>
        <button type="button" id="closeModalBtn" class="close-btn" aria-label="Tutup detail spesifikasi">
          <i data-lucide="x" style="width:17px;height:17px;"></i>
        </button>
      </div>
      <div id="modalBody" class="modal-body"></div>
    </div>
  </div>

  <footer>
    <div class="wrap footer-inner">
      <span><strong>LaptopKu</strong> &mdash; Sistem Pendukung Keputusan Pemilihan Laptop Mahasiswa</span>
      <span>UKRIDA</span>
    </div>
  </footer>

  <script>
    // 1. LENIS LUXURY SMOOTH SCROLL (High-inertia lerp seperti vytautastattoo.com)
    const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    window.__lenis = null;

    if (!prefersReducedMotion && typeof Lenis !== 'undefined') {
      window.__lenis = new Lenis({
        lerp: 0.075,
        wheelMultiplier: 0.95,
        touchMultiplier: 1.5,
        smoothWheel: true
      });

      function raf(time) {
        window.__lenis.raf(time);
        requestAnimationFrame(raf);
      }
      requestAnimationFrame(raf);
    }

    // 2. UNIVERSAL SCROLL REVEAL & STAGGERED GRID OBSERVER
    const scrollObserver = new IntersectionObserver(
      (entries) => {
        let batchIndex = 0;
        entries.forEach((entry) => {
          if (entry.isIntersecting) {
            const el = entry.target;
            if (el.classList.contains('grid-reveal')) {
              el.style.setProperty('--stagger-delay', `${(batchIndex % 4) * 90}ms`);
              batchIndex++;
            }
            el.classList.add('is-visible');
            scrollObserver.unobserve(el);
          }
        });
      },
      { threshold: 0.1, rootMargin: '0px 0px -40px 0px' }
    );

    window.observeAnimatedElements = function (root = document) {
      if (root.nodeType === 1 && root.matches('.reveal, .grid-reveal') && !root.classList.contains('is-visible')) {
        scrollObserver.observe(root);
      }
      if (root.querySelectorAll) {
        root.querySelectorAll('.reveal, .grid-reveal').forEach((el) => {
          if (!el.classList.contains('is-visible')) {
            scrollObserver.observe(el);
          }
        });
      }
    };

    const domMutationObserver = new MutationObserver((mutations) => {
      mutations.forEach((m) => {
        m.addedNodes.forEach((node) => {
          if (node.nodeType === 1) {
            window.observeAnimatedElements(node);
          }
        });
      });
    });
    domMutationObserver.observe(document.body, { childList: true, subtree: true });
    window.observeAnimatedElements(document);

    const formatRupiah = (angka) =>
      new Intl.NumberFormat('id-ID', {
        style: 'currency',
        currency: 'IDR',
        maximumFractionDigits: 0
      }).format(angka || 0);

    window.__LAPTOP_STORE__ = {};
    const FALLBACK_LAPTOP_IMG = 'https://images.unsplash.com/photo-1588872657578-7efd1f1555ed?w=800&q=80';

    function registerLaptopItem(item) {
      window.__LAPTOP_STORE__[item.id] = item;
    }

    function openLaptopModal(id) {
      const item = window.__LAPTOP_STORE__[id];
      if (!item) return;

      document.getElementById('modalBrandBadge').textContent = `KLASTER ${String(item.cluster_label).toUpperCase()} • RANKING GLOBAL #${item.ranking}`;
      document.getElementById('modalTitle').textContent = `${item.brand} ${item.model_name}`;

      const scoreInfo = item.dynamic_score !== undefined
        ? `${(item.dynamic_score * 100).toFixed(2)}% (TOPSIS Dinamis)`
        : `${(item.preference_value * 100).toFixed(2)}% (Preferensi Dasar)`;

      const modalImg = item.image_url || FALLBACK_LAPTOP_IMG;

      document.getElementById('modalBody').innerHTML = `
        <div class="modal-hero">
          <img src="${modalImg}" alt="${item.brand} ${item.model_name}" onerror="this.onerror=null;this.src='${FALLBACK_LAPTOP_IMG}'" />
          <div>
            <div style="font-size:0.8rem;color:var(--muted);margin-bottom:4px;">${item.brand} &bull; ${item.category || 'Notebook'}</div>
            <div style="font-size:0.85rem;color:var(--ink);font-weight:500;margin-bottom:8px;">${item.full_name || ''}</div>
            <div class="price-accent" style="font-size:1.4rem;margin-bottom:8px;">${formatRupiah(item.price_idr)}</div>
            <span class="score-pill">Skor Kecocokan: ${scoreInfo}</span>
          </div>
        </div>
        <div class="full-spec-grid">
          <div class="spec-cell">
            <div class="spec-cell-label">Prosesor (CPU)</div>
            <div class="spec-cell-val">${item.cpu}</div>
          </div>
          <div class="spec-cell">
            <div class="spec-cell-label">Kartu Grafis (GPU)</div>
            <div class="spec-cell-val">${item.gpu}</div>
          </div>
          <div class="spec-cell">
            <div class="spec-cell-label">Memori (RAM)</div>
            <div class="spec-cell-val mono">${item.ram_gb} GB</div>
          </div>
          <div class="spec-cell">
            <div class="spec-cell-label">Penyimpanan (Storage)</div>
            <div class="spec-cell-val mono">${item.storage_gb} GB ${item.storage_type || ''}</div>
          </div>
          <div class="spec-cell">
            <div class="spec-cell-label">Layar &amp; Kondisi Unit</div>
            <div class="spec-cell-val mono">${item.screen_size || '-'} Inci (Touch: ${item.touchscreen || 'No'}) &bull; ${item.status || 'New'}</div>
          </div>
          <div class="spec-cell">
            <div class="spec-cell-label">Skor Benchmark (CPU / GPU)</div>
            <div class="spec-cell-val mono">${item.cpu_score} / ${item.gpu_score}</div>
          </div>
        </div>
      `;

      document.getElementById('specModal').classList.add('open');
      if (window.__lenis) window.__lenis.stop();
      lucide.createIcons();
    }

    function closeLaptopModal() {
      document.getElementById('specModal').classList.remove('open');
      if (window.__lenis) window.__lenis.start();
    }

    function renderLaptopCard(item, badgeLabel, subText) {
      registerLaptopItem(item);
      const specSummary = `${item.cpu} &bull; ${item.ram_gb} GB RAM &bull; ${item.storage_gb} GB ${item.storage_type || 'SSD'} &bull; ${item.gpu}`;
      const cardImg = item.image_url || FALLBACK_LAPTOP_IMG;
      return `
        <article class="card grid-reveal" onclick="openLaptopModal(${item.id})" tabindex="0" onkeydown="if(event.key==='Enter')openLaptopModal(${item.id})">
          <div class="card-media">
            <span class="badge-minimal">${badgeLabel}</span>
            <img src="${cardImg}" alt="${item.brand} ${item.model_name}" loading="lazy" onerror="this.onerror=null;this.src='${FALLBACK_LAPTOP_IMG}'" />
          </div>
          <div class="card-body">
            <h3 class="card-title">${item.brand} ${item.model_name}</h3>
            <p class="card-summary">${specSummary}</p>
            <div class="card-bottom">
              <div class="short-rule"></div>
              <div class="price-accent">${formatRupiah(item.price_idr)}</div>
              <span class="sub-score">${subText}</span>
            </div>
          </div>
        </article>
      `;
    }

    document.getElementById('closeModalBtn').addEventListener('click', closeLaptopModal);
    document.getElementById('specModal').addEventListener('click', (e) => {
      if (e.target.id === 'specModal') closeLaptopModal();
    });
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') closeLaptopModal();
    });

    lucide.createIcons();
  </script>
  {% block extra_js %}{% endblock %}
</body>
</html>
